# WASP-96b with cold starts: wasp96b.yaml with every chemistry solve started from equilibrium, so the likelihood is
# a fixed function of the parameters. The pair is the test of what warm starts do to a whole posterior, the part a
# re-solve of the warm run's own rows cannot see (docs/method.md "Warm starts").
#
#   python tools/submit.py runs/survey/wasp96b_cold.yaml [--dry-run]
base: survey_base.yaml
sampler:
  warm_starts: false
config:
  run_label: WASP-96b
  vulcan_cfg_name: data/survey/w96b/W96b.yaml
  rp_cm: 8.717001e+09                # Rp/Rs 0.11933 (median depth of the fitted bins) x R* 1.05 R_Sun
  rstar_cm: 7.304850e+10
  tp_gravity_cgs: 800.27                # G Mp / rp_cm^2, Mp 0.48 M_J (Hellier+2014)
  obs_dir: data/survey/w96b
  obs_products: {NRS1: [G395H_NRS1_R300.csv], NRS2: [G395H_NRS2_R300.csv]}
  combo: [NRS1, NRS2]                 # the bluest group is the offset reference
  prior_Tirr: [739.1, 2586.9]            # [0.4, 1.4] x sqrt(2) Teq, Teq 1307 K
  prior_lnM_sigma: 0.0625             # the mass error of Hellier+2014 (the mass is fixed: read by the mass check only)
