# HAT-P-26b in the sulfur survey: survey_base.yaml plus this planet's numbers (the recipe:
# notes "Design records", sulfur survey case). Data: Gressier+2025 G395H, the transitspectroscopy reduction
# (their main-text spectrum; AJ data behind Fig. 2, R~400), binned to R100 per detector.
#
#   python tools/submit.py runs/survey/hatp26b.yaml [--dry-run]
base: survey_base.yaml
config:
  run_label: HAT-P-26b
  vulcan_cfg_name: data/survey/hp26b/HATP26b.yaml
  rp_cm: 4.344750e+09                # Rp/Rs 0.07178 (median depth in the window) x R* 0.87 R_Sun
  rstar_cm: 6.052590e+10
  tp_gravity_cgs: 469.79                # G Mp / rp_cm^2, Mp 0.07 M_J
  obs_dir: data/survey/hp26b
  obs_products: {NRS1: [G395H_NRS1_R100.csv], NRS2: [G395H_NRS2_R100.csv]}
  combo: [NRS1, NRS2]                 # the bluest group is the offset reference
  prior_Tirr: [610.9, 2138.3]            # [0.4, 1.4] x sqrt(2) Teq, Teq 1080 K
  prior_lnM_sigma: 0.2857             # the archive mass error
