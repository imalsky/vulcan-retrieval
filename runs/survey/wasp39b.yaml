# WASP-39b in the sulfur survey: survey_base.yaml plus this planet's numbers (the recipe:
# notes "Design records", sulfur survey case). Data: Carter & May 2024 G395H R100 (data/cm24_wasp39b).
#
#   python tools/submit.py runs/survey/wasp39b.yaml [--dry-run]
base: survey_base.yaml
config:
  run_label: WASP-39b
  vulcan_cfg_name: data/survey/w39b/W39b.yaml
  rp_cm: 9.546962e+09                # Rp/Rs 0.14614 (median depth in the window) x R* 0.939 R_Sun
  rstar_cm: 6.532623e+10
  tp_gravity_cgs: 390.58                # G Mp / rp_cm^2, Mp 0.281 M_J
  obs_dir: data/cm24_wasp39b
  obs_products: {NRS1: [G395H_NRS1_R100.csv], NRS2: [G395H_NRS2_R100.csv]}
  combo: [NRS1, NRS2]                 # the bluest group is the offset reference
  prior_Tirr: [659.6, 2308.6]            # [0.4, 1.4] x sqrt(2) Teq, Teq 1166 K
  prior_lnM_sigma: 0.1139             # the archive mass error
