# HD209458b in the sulfur survey: survey_base.yaml plus this planet's numbers (the recipe:
# notes "Design records", sulfur survey case). Data: Zenodo 10557924 NIRCam F322W2 + F444W (Xue+2024), the Eureka! columns as published, one group as the authors fitted them.
#
#   python tools/submit.py runs/survey/hd209458b.yaml [--dry-run]
base: survey_base.yaml
config:
  run_label: HD209458b
  vulcan_cfg_name: data/survey/hd209b/HD209b.yaml
  rp_cm: 9.994883e+09                # Rp/Rs 0.12073 (median depth of the fitted bins) x R* 1.19 R_Sun
  rstar_cm: 8.278830e+10
  tp_gravity_cgs: 925.76                # G Mp / rp_cm^2, Mp 0.73 M_J (Stassun+2017)
  obs_dir: data/survey/hd209b
  obs_products: {NIRCam: [NIRCam_F322W2_F444W.csv]}
  combo: [NIRCam]                 # one group, no offset: the authors fit none
  prior_Tirr: [819.4, 2868.1]            # [0.4, 1.4] x sqrt(2) Teq, Teq 1449 K
  prior_lnM_sigma: 0.0548             # the mass error of Stassun+2017 (the mass is fixed: read by the mass check only)
