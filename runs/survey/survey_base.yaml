# The sulfur survey: one model, one prior set and one data recipe for every planet, so a
# difference between planets is a difference in the planets (notes "Design records",
# sulfur survey). Each planet is a file beside this one that names it as `base:` and adds
# only its own numbers (system, data files, Tirr prior, mass error); this file is the
# base, never a run: it names no planet or data source, so run_setup.load_spec refuses it alone.
#
#   python tools/submit.py runs/survey/<planet>.yaml [--dry-run]
#
# Data: one JWST data set per planet (a NIRSpec G395H or G395M transit, or NIRCam
# F322W2 + F444W in two visits), the product its paper adopts for its main result, as
# published (WASP-107b alone is binned here, from R 950 to R 100: finer than the model takes),
# fitted on every published bin the model band covers; one offset per group after the
# bluest and one noise inflation per group, integrated out.
# Chemistry: rtol 0.2 (VULCAN's default) within 5000 steps, warm starts (each run's cold re-solve must pass
# before it is reported: docs/method.md "Warm starts"), constant Kzz, 10 bar bottom.
# YAML reads 1e11 as text: write 1.0e+11.
#
# 10 sampled parameters: lnZ, c_o, lnKzz, s_o, Tirr, log10kappa, log10gamma, Tint,
# lnR0, log10P_deck.

runtime:
  solver: ffi
  chem_rhs: grouped
  bt_buffers: null
  gpu_memory_fraction: 0.90
  xla_flags: "--xla_gpu_enable_triton_gemm=false --xla_gpu_autotune_level=0 --xla_gpu_enable_command_buffer=FUSION,CUBLAS,CUSTOM_CALL,WHILE"

sampler:
  n_live: 1000                         # the most accurate setting tested on this posterior (notes "Sampler")
  n_eff: 5000                          # the maintainer's choice; nautilus's default is 10000. A run the 46 h wall stops
                                       # short of it writes the posterior it has (notes "Warm starts")
  n_batch: null
  warm_starts: true                    # a cold run costs 4-5 times the wall time (notes "Warm starts")

config:
  seed: 20261029
  network: thermo/SNCHO_photo_network_2025.txt
  atom_list: [H, O, C, N, S]           # the network's elements, frozen with it

  # ---- forward model (as the WASP-107b case) -----------------------------------------
  nz: 100                              # log-uniform over 1e-9..10 bar (9.9 per decade)
  # H2CO and CS: the per-planet leave-one-out screen found each over the gate on one planet (notes "Physics
  # assumptions and limitations"); one list for all six planets.
  molecules: [H2O, CO2, CO, CH4, SO2, HCN, C2H2, H2S, NH3, OCS, SH, SO, H2CO, CS]
  nu_min: 1900.0                       # cm^-1 (5.26 um); the band every production run uses
  nu_max: 9900.0                       # cm^-1 (1.01 um)
  art_nlayer: 100                      # ExoJAX's default (notes "Design records")
  art_pbtm_bar: 7.0                    # bar: the RT grid bottom, above the chemistry's
  dt_max: 1.0e+11
  # update_frq 1: the geometry refreshed every step, so the geometry term passes once the column has settled: on 36
  # WASP-96b draws 2 more certify and the CPU time falls 13% against every 100 steps (notes "Pipeline speed").
  cfg_overrides: {rtol: 0.2, ini_update_photo_frq: 1, final_update_photo_frq: 1, update_frq: 1,
                  queue_compact: [396, 264, 132]}
  count_max: 5000                      # the first campaign's cap, the one its timings are for (notes "Warm starts")
  p_ref_bar: 1.0e-3                    # rp_cm and g apply at 1 mbar

  # ---- data window, the same for every planet ---------------------------------------
  obs_wl_lo: 2.30                      # um: every published bin inside the model band (1.01-5.26 um)
  obs_wl_hi: 5.25
  obs_max_bin_R: 500.0                 # the model's limit: a bin spans two bands of the R 1000 tables
  generate_synthetic_data: false

  # ---- T-P: Guillot profile, f = 1/4 (the planet sets prior_Tirr) --------------------
  tp_infer_Tint: true
  tp_deep_param: Tint
  tp_deep_p_bar: 1.0                   # bar: the level the report quotes the deep temperature at
  prior_Tint: [100.0, 550.0]           # K: the published ranges (notes "Design records"); out-of-window profiles are rejected
  prior_log10kappa: [-3.5, 0.5]        # IR opacity, cm^2/g
  prior_log10gamma: [-3.0, 0.3010299956639812]

  # ---- composition and mixing --------------------------------------------------------
  prior_lnZ: [-4.605170185988091, 4.605170185988092]    # 0.1x-1000x solar about the 10x baseline
  baseline_metallicity_solar: 10.0
  prior_c_o: [-3.08922261664133, 0.24]  # C/O 0.025-0.70 about the 0.549 baseline
  prior_lnKzz: [-4.605170185988091, 9.210340371976184]  # constant Kzz 1e7-1e13 about 1e9 cm^2/s
  infer_s_o: true
  prior_s_o: [-2.302585092994046, 2.302585092994046]    # S/O x0.1-10 about the baseline
  prior_lnR0: [-0.2, 0.2]              # -18% to +22% in radius
  infer_lnM: false                     # the mass is fixed at the published value

  # ---- clouds and noise, stated so the campaign cannot drift -------------------------
  cloud_model: deck                    # an opaque grey deck below a free top pressure
  prior_log10P_deck: [-8.0, 0.8]       # bar: 1e-8 bar to the RT grid's bottom (a deck there is a clear column)
  prior_offset_ppm: [-800.0, 800.0]    # per extra detector
  infer_noise_inflation: true
  prior_noise_inflation: [1.0, 3.0]    # log10-uniform, one per detector; never below 1 (errors are not shrunk)
  noise_inflation_per_group: true
  integrate_nuisance: true

  # ---- lanes and wall ------------------------------------------------------------------
  cold_lanes: 528                      # the lanes that run on one GH200
  walltime_seconds: 165600             # 46 h governor (gpu_long)
