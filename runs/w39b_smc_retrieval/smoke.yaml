# Offline smoke test on the CPU: the real chemistry + RT pipeline in minutes (the slow
# tests build it; tests/conftest.py loads this file). CO-only opacity (the one cached
# k-table), a coarse column, a synthetic injection on the synthetic constant-R bin grid
# (no data source: the CO band holds no observed bin).
# 8 parameters: lnZ, c_o, lnKzz, Tirr, log10kappa, lnR0, 2 cloud. No governor
# (walltime_seconds), so tools/submit.py refuses it. Every prior and truth it reads is
# stated here, so a change to another spec never moves what the test suite builds.
#
#   python -m retrieval_framework.run_nautilus runs/w39b_smc_retrieval/smoke.yaml

runtime:
  solver: fast                         # VULCAN3_SOLVER
  chem_rhs: codegen                    # VULCAN3_CHEM_RHS
  bt_buffers: null
  gpu_memory_fraction: null            # null: the variable must be unset
  xla_flags: null

sampler:
  n_live: 1000
  n_eff: 10000
  n_batch: null
  warm_starts: true

config:
  run_label: WASP-39b
  seed: 20260704                       # nautilus and the synthetic injection
  vulcan_cfg_name: W39b
  network: thermo/SNCHO_photo_network_2025.txt
  atom_list: [H, O, C, N, S]           # the network's elements, frozen with it
  nz: 30
  cloud_model: powerlaw                # stated, not inherited: a uniformly mixed power-law opacity
  molecules: [CO]
  omit_core_molecules: [H2O, CH4, NH3, H2S]   # a one-molecule synthetic case: these also absorb at 2.29-2.34 um
  nu_min: 4280.0                       # cm^-1: the CO 2-0 band only
  nu_max: 4360.0
  art_nlayer: 20
  art_pbtm_bar: 7.0                    # bar: the RT grid bottom, above the chemistry's
  dt_max: 1.0e+11
  count_max: 30000                     # W39b.yaml's cap, stated
  cfg_overrides: {Rp: 8650532000.0}    # 1.21 R_Jup, the chemistry's 1-bar radius
  rp_cm: 9143826800.0                  # 1.279 R_Jup
  rstar_cm: 64839240000.0              # 0.932 R_Sun
  tp_gravity_cgs: 422.0
  p_ref_bar: 1.0e-3
  infer_offsets: false                 # one synthetic group: no offsets
  tp_infer_gamma: false
  tp_Tint_K: 150.0                     # K, the fixed deep parameter
  tp_gamma_fixed: 0.4                  # the fixed visible-to-IR opacity ratio
  tp_deep_p_bar: 1.0                   # bar: the report quotes T here
  generate_synthetic_data: true
  prior_lnZ: [-2.302585092994046, 2.302585092994046]
  baseline_metallicity_solar: 10.0
  prior_c_o: [-1.70, 0.24]
  prior_lnKzz: [-2.3025850929940455, 6.907755278982137]
  prior_Tirr: [700.0, 2200.0]
  prior_log10kappa: [-3.5, 0.5]
  prior_lnR0: [-0.05, 0.15]
  prior_log10kappa_cloud: [-7.0, 1.0]
  prior_cloud_alpha: [0.0, 6.0]
  # the injection: every truth the synthetic run reads
  truth_lnZ: 0.0
  truth_c_o: 0.0
  truth_lnKzz: 0.0
  truth_Tirr: 1650.0
  truth_log10kappa: -2.0
  truth_lnR0: 0.0
  truth_log10kappa_cloud: -6.5                # a thin cloud
  truth_cloud_alpha: 1.0
  truth_noise_inflation: 1.0
  prior_lnM_sigma: 0.11                # read by the forward checks' mass variant; lnM is not sampled here
  cold_lanes: 144
