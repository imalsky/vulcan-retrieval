# WASP-107b joint fit with MIRI and two prior edges widened: w107b_joint_miri with the
# Tirr floor at 400 K and the log10 gamma ceiling at 1.0 (the C/O floor is 0.05 in every
# MIRI run). These are the edges the finished runs pressed (notes "Runs", w107b entry);
# the run measures the shift in O/H, C/O and Kzz against w107b_joint_miri. Below ~450 K
# the Tirr draws meet the 320 K opacity floor for about half the posterior and are
# rejected as T-P-out, which is accepted. Data handling, the published errors and the
# model's limits as w107b_joint_miri (no 6-11 um aerosol term, no nitrogen freedom).
#
#   python tools/submit.py runs/w107b/w107b_joint_miri_edges.yaml [--dry-run]
base: w107b_joint.yaml
config:
  obs_products:
    WFC3_NIRCam: [WFC3_G102.csv, WFC3_G141_20.csv, NIRCam_F322W2_native_m81ppm.csv, NIRCam_F444W_native.csv]
    NIRSpec: [G395H_NRS1_R300.csv, G395H_NRS2_R300.csv]
    MIRI: [MIRI_LRS.csv]
  combo: [WFC3_NIRCam, NIRSpec, MIRI]
  nu_min: 800.0                        # cm^-1 (12.5 um)
  obs_wl_hi: 12.0                      # um: keeps the 47 MIRI bins (centres to 11.98)
  prior_c_o: [-2.396, 0.24]            # C/O 0.05-0.70 about the 0.549 baseline: ln(0.05/0.549)
  infer_noise_inflation: false
  noise_inflation_per_group: false
  prior_Tirr: [400.0, 1500.0]
  prior_log10gamma: [-3.0, 1.0]
