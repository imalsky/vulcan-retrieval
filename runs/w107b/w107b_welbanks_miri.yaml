# WASP-107b on Welbanks+2024's data handled as he did (the maintainer decided): WFC3 G102
# and G141 (the 20 bins to 1.629 um) and NIRCam F322W2 (100 native bins, offset by -81
# ppm) and F444W (the 72 bins to 4.97 um) in one frame with no offsets, MIRI LRS (the 47
# bins to ~12 um) with one free offset, the published error bars as they are. His MIRI
# offset (Delta_MIRI, prior -50..500 ppm, +282) raises the MIRI data to F444W's level
# (MIRI sits ~250 ppm below it at 5 um); here an offset is added to the model, so the
# same prior is -500..50 ppm. The joint spec's model; C/O floor 0.05 (his prior); the
# band to 12.5 um. Not modelled: the 7-10 um aerosol term and a nitrogen freedom
# (w107b_joint_miri). A base has no base of its own, so this restates w107b_welbanks's
# keys (combo, the 22 h governor: fits gpu_normal's 24 h wall; resume to finish).
#
#   python tools/submit.py runs/w107b/w107b_welbanks_miri.yaml --queue gpu_normal [--dry-run]
base: w107b_joint.yaml
config:
  obs_products:
    WFC3_NIRCam: [WFC3_G102.csv, WFC3_G141_20.csv, NIRCam_F322W2_native_m81ppm.csv, NIRCam_F444W_native.csv]
    NIRSpec: [G395H_NRS1_R300.csv, G395H_NRS2_R300.csv]
    MIRI: [MIRI_LRS.csv]
  combo: [WFC3_NIRCam, MIRI]
  nu_min: 800.0                        # cm^-1 (12.5 um)
  obs_wl_hi: 12.0                      # um: keeps the 47 MIRI bins (centres to 11.98)
  prior_c_o: [-2.396, 0.24]            # C/O 0.05-0.70 about the 0.549 baseline: ln(0.05/0.549)
  infer_noise_inflation: false
  noise_inflation_per_group: false
  prior_offset_ppm: [-500.0, 50.0]
  walltime_seconds: 79200
