# WASP-107b: one joint retrieval of the JWST + HST transmission spectrum with VULCAN
# photochemistry solved per draw, to constrain Kzz and test Welbanks+2024
# (arXiv:2405.11018: log10 Kzz 8.6, 12x solar, Tint ~490 K) against Sing+2024
# (arXiv:2405.11027: log10 Kzz 11.6, 43x solar, Tint 460 K). Their Kzz grids do not overlap
# (7-10 and 11-13); the prior here spans both. Each paper's data alone:
# w107b_g395h.yaml (Sing) and w107b_welbanks.yaml (Welbanks without MIRI, which is past
# the model band). Machinery as the WASP-39b v5 spec; the step tolerance is looser.
#
#   python tools/submit.py runs/w107b/w107b_joint.yaml [--dry-run]
#
# 12 sampled parameters: lnZ, c_o, lnKzz, s_o, Tirr, log10kappa, log10gamma, T1bar,
# lnR0, lnM, log10kappa_cloud, cloud_alpha. The 5 offsets and 6 noise inflations are
# integrated out (integrate_nuisance). YAML reads 1e11 as text: write 1.0e+11.

runtime:
  solver: ffi
  chem_rhs: grouped
  bt_buffers: null
  gpu_memory_fraction: 0.90
  xla_flags: "--xla_gpu_enable_triton_gemm=false --xla_gpu_autotune_level=0 --xla_gpu_enable_command_buffer=FUSION,CUBLAS,CUSTOM_CALL,WHILE"

sampler:
  n_live: 1000
  n_eff: 5000
  n_batch: null
  warm_starts: true

config:
  # ---- identity ---------------------------------------------------------------
  run_label: WASP-107b
  seed: 20261024
  # the case's own vulcan3 config (a path from the repo root): SNCHO network, 10x solar
  # baseline, 10 bar .. 1e-9 bar, constant Kzz 1e9 cm^2/s, the HD 85512 UV proxy
  vulcan_cfg_name: data/w107b/W107b.yaml
  network: thermo/SNCHO_photo_network_2025.txt   # required; the three finished runs ran thermo/SNCHO_photo_network.txt

  # ---- forward model (as v5) ----------------------------------------------------
  nz: 100                              # log-uniform over 1e-9..10 bar (10 per decade)
  molecules: [H2O, CO2, CO, CH4, SO2, HCN, C2H2, H2S, NH3, OCS, SH, SO]
  nu_min: 1900.0                       # cm^-1 (5.26 um)
  nu_max: 9900.0                       # cm^-1 (1.01 um)
  art_nlayer: 67
  dt_max: 1.0e+11
  # rtol 0.2 (vulcan3's default.yaml; v5 uses 0.05): at constant Kzz 10^8.6 a cold column needs
  # 13085 steps at rtol 0.05 and 3867 at 0.2, and the two converged spectra differ by at
  # most 0.06 sigma (notes "Design records", WASP-107b case). Photolysis every step.
  cfg_overrides: {rtol: 0.2, ini_update_photo_frq: 1, final_update_photo_frq: 1, queue_compact: [396, 264, 132]}
  count_max: 5000

  # ---- planet (RT geometry): Piaulet+2021 (arXiv:2011.13444) ------------------------
  rp_cm: 6.6748e+09                    # Rp/Rs 0.1432 x 0.67 R_Sun: the transit radius, at 1 mbar
  rstar_cm: 4.66119e+10                # 0.67 R_Sun
  tp_gravity_cgs: 272.87               # G (30.5 M_E) / rp_cm^2
  p_ref_bar: 1.0e-3

  # ---- data (data/w107b; recipe in notes "Design records", WASP-107b) --------------
  # G395H: Sing+2024 binned to R100 per detector. NIRCam (Eureka!) and WFC3 (Pegasus):
  # Welbanks+2024, NIRCam merged to R ~100. Each detector and visit its own group (one
  # offset and one inflation each, integrated out); G102 is the offset reference.
  obs_dir: data/w107b
  obs_products:
    G102: [WFC3_G102.csv]
    G141: [WFC3_G141.csv]
    F322W2: [NIRCam_F322W2_R100.csv]
    F444W: [NIRCam_F444W_R100.csv]
    NRS1: [G395H_NRS1_R100.csv]
    NRS2: [G395H_NRS2_R100.csv]
  combo: [G102, G141, F322W2, F444W, NRS1, NRS2]
  obs_wl_lo: 1.02                      # um: keeps the 4 G102 bins inside the band (the 1.083 um He line is between two of them)
  obs_wl_hi: 5.24
  generate_synthetic_data: false

  # ---- T-P: Guillot profile, f = 1/4 ---------------------------------------------
  tp_infer_Tint: true
  tp_deep_param: T1bar
  # T at 1 bar: both papers put the quench region at ~1000-1300 K near 0.3-1 bar; the
  # opacity window rejects the hottest deep profiles
  prior_T1bar: [400.0, 2000.0]
  # Tirr = sqrt(2) Teq, Teq 734 K (Teff 4425 K, R* 0.67, a 0.0566 AU) -> 1038 K
  prior_Tirr: [600.0, 1500.0]
  prior_log10gamma: [-3.0, 0.3010299956639812]

  # ---- composition and mixing ------------------------------------------------------
  prior_lnZ: [-2.302585092994046, 3.4011973816621555]   # 1x-300x solar about the 10x baseline
  baseline_metallicity_solar: 10.0
  prior_c_o: [-1.70, 0.24]             # C/O 0.10-0.70 about the 0.549 baseline
  # constant Kzz 1e9 e^lnKzz: 1e6-1e13 cm^2/s, both papers' ranges and Sing's sound-speed bound
  prior_lnKzz: [-6.907755278982137, 9.210340371976184]
  infer_s_o: true
  prior_s_o: [-2.302585092994046, 2.302585092994046]
  prior_lnR0: [-0.1, 0.1]
  infer_lnM: true                      # lnM = ln(M / 30.5 M_E) ~ N(0, 1.7/30.5)
  prior_lnM_sigma: 0.0557

  # ---- clouds and noise -----------------------------------------------------------
  infer_noise_inflation: true
  noise_inflation_per_group: true
  integrate_nuisance: true

  # ---- lanes and wall ------------------------------------------------------------
  cold_lanes: 176
  walltime_seconds: 165600             # 46 h governor (gpu_long)
