# WASP-107b joint fit with MIRI: w107b_joint's model and solver settings, with the data
# handled as the papers did (the maintainer decided): Welbanks+2024's NIRCam F322W2 (100
# native 0.015 um bins, offset by -81 ppm as in his retrievals) and F444W (the 72 bins to
# 4.97 um), WFC3 G102 and G141 (the 20 bins to 1.629 um) in one frame with no offsets
# among them; Sing+2024's G395H at R300 per detector as one block with one free offset;
# MIRI LRS (the 47 bins to ~12 um) with one free offset. The published error bars are
# used as they are (no inflation). C/O floor 0.05 (Welbanks's prior). The model band
# reaches 12.5 um.
#
# Not modelled: the 7-10 um aerosol absorption Welbanks fit with a "resonance" term and
# Dyrek+2024 with silicates, and a nitrogen freedom (Welbanks scaled NH3 x29): a
# documented follow-up decided from these runs' MIRI 7-10 um residuals (todo).
#
#   python tools/submit.py runs/w107b/w107b_joint_miri.yaml [--dry-run]
#
# 12 sampled parameters as w107b_joint; the 2 offsets (NIRSpec, MIRI against the
# WFC3/NIRCam frame, uniform +-800 ppm on the model) are integrated out.
base: w107b_joint.yaml
config:
  obs_products:
    WFC3_NIRCam: [WFC3_G102.csv, WFC3_G141_20.csv, NIRCam_F322W2_native_m81ppm.csv, NIRCam_F444W_native.csv]
    NIRSpec: [G395H_NRS1_R300.csv, G395H_NRS2_R300.csv]
    MIRI: [MIRI_LRS.csv]
  combo: [WFC3_NIRCam, NIRSpec, MIRI]
  nu_min: 800.0                        # cm^-1 (12.5 um)
  obs_wl_hi: 12.0                      # um: keeps the 47 MIRI bins (centres to 11.98)
  prior_c_o: [-2.396, 0.24]            # C/O 0.05-0.70 about the 0.549 baseline: ln(0.05/0.549)
  infer_noise_inflation: false
  noise_inflation_per_group: false
