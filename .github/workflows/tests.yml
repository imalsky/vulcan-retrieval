name: tests

# Fast, dependency-light CI: exercises the sampler core, u-space prior machinery,
# binning matrix, and init reject-and-cull logic on stub pipelines (CPU jax only).
# The chemistry/RT integration tests (test_warm_reject, ...) skip cleanly without
# the VULCAN-JAX + ExoJax stack and its opacity caches -- those run locally / on HPC.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        # 3.10 is the NAS deploy interpreter (pyt2_8_gh = 3.10.18); keep it tested
        # so the requires-python = ">=3.10" claim stays verified.
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install minimal deps (no chemistry/RT stack)
        # --no-deps throughout: the siblings are not on PyPI, so a plain
        # editable install would try (and fail) to resolve them there, and
        # their heavy trees (exojax, the full JAX stack) are not wanted here.
        #
        # vulcan-forward IS needed, from GitHub: retrieval_framework.forward.
        # config re-exports vulcan_forward.constants + paths at import time,
        # so without it three test modules died at collection (red since
        # 2026-07-15). Those two engine modules are stdlib-only; anything
        # reaching vulcan_chem/exojax_rt still skips via importorskip.
        run: |
          pip install "jax>=0.6" numpy scipy pytest
          pip install --no-deps "vulcan-jax @ git+https://github.com/imalsky/jax-vulcan.git"
          pip install --no-deps "vulcan-forward @ git+https://github.com/imalsky/vulcan-forward.git"
          pip install --no-deps -e .
      - name: Run stub-pipeline unit tests
        run: python -m pytest tests -q -ra
