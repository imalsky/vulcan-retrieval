# vulcan-retrieval: the nested-sampling (nautilus) atmospheric retrieval
# framework. The differentiable VULCAN-JAX -> ExoJAX forward model it runs on
# is the shared `vulcan-forward` distribution, not part of this package.
# Editable install is the supported dev mode (pip install -e . --no-deps in a
# checkout of this repo); a site-packages/TestPyPI install works for the code
# but must set VULCAN_PROJECT_ROOT so the repo data/ tree (observations +
# opacity caches) resolves -- see forward/config.py.
#
# The vulcan3 dependency below is the TestPyPI release line. The exact
# validated chemistry commit for HPC runs is pinned in requirements-hpc.txt.
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vulcan-retrieval"
dynamic = ["version"]
description = "Differentiable VULCAN-JAX photochemistry -> ExoJAX transmission forward model and nested-sampling retrieval framework (WASP-39b)"
readme = "README.md"
# requires-python >= 3.10: the NAS deploy env (pyt2_8_gh) is Python 3.10.18, and
# jax/jaxlib 0.6.2 is the last jax line that supports 3.10.
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Isaac Malsky" }]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "jax>=0.6.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "PyYAML>=6",        # the run specification files (run_setup.load_spec)
    # The forward-model engine (chemistry + ExoJAX RT) owns the exojax pin.
    # Floor: the caller names the network and its atoms (select_network) and the
    # RT bottom (art_pbtm_bar), with no engine default, which this package assumes.
    "vulcan-forward>=0.31.0",
    # Floor: conv_normal and validate_overrides (vulcan-forward's own floor).
    "vulcan3>=0.18.0",
]

[project.urls]
Homepage = "https://github.com/imalsky/vulcan-retrieval"
Repository = "https://github.com/imalsky/vulcan-retrieval"

[project.optional-dependencies]
# Posterior plotting: needed by nautilus_report.py's figures and the figure
# scripts, never by a forward solve or a sampler run, so they stay out of the
# core install (a downstream consumer of the engine should not inherit a
# corner-plot library).
plot = ["matplotlib", "corner"]

# Nested sampling (run_nautilus.py): nautilus pulls scikit-learn; h5py is its
# checkpoint format.
nautilus = ["nautilus-sampler==1.0.6", "h5py>=3"]

dev = ["pytest>=7", "ruff>=0.11", "build>=1.2", "twine>=5",
       "nautilus-sampler==1.0.6", "h5py>=3"]

[dependency-groups]
test = [
    "pytest>=8",
    "pytest-xdist>=3",
    "pytest-cov>=5",
]
dev = [
    { include-group = "test" },
]

[tool.setuptools]
package-dir = { "" = "src" }
# No package data: every data file (observations, opacity caches,
# run outputs) lives at the repo-root data/ tree, addressed via VULCAN_PROJECT_ROOT.
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "retrieval_framework._version.__version__" }

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
# The normal tier (plain `pytest tests`, and CI) deselects `slow`, with a
# visible deselected count. The full tier adds `-m "slow or not slow"`; a
# single slow file or node id needs `-m slow`.
addopts = ["-ra", "--tb=short", "--strict-markers", "--strict-config", "-m", "not slow"]
xfail_strict = true
log_level = "INFO"
filterwarnings = [
    "error",
    # exojax warns for every ArtTransPure built without a wavenumber grid; the transmission model has none by design.
    "ignore:nu_grid is not given:UserWarning",
]
markers = [
    # Integration tests that build a real chemistry + RT pipeline
    # (test_cold_reject, test_condensation_live_tp, test_set_observations,
    # test_v5_options).
    "slow: builds a real chemistry/RT pipeline; minutes, not seconds",
    "gpu: needs a GPU; runs locally, never in CI",
]

[tool.ruff]
line-length = 120
show-fixes = true

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "D",      # pydocstyle
    "N",      # pep8-naming
    "C90",    # mccabe complexity
    "ARG",    # flake8-unused-arguments
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "EXE",    # flake8-executable
    "FURB",   # refurb
    "G",      # flake8-logging-format
    "ICN",    # flake8-import-conventions
    "ISC",    # flake8-implicit-str-concat
    "LOG",    # flake8-logging
    "NPY",    # NumPy specific rules
    "PERF",   # perflint
    "PGH",    # pygrep-hooks
    "PL",     # pylint
    "PT",     # flake8-pytest-style
    "PTH",    # flake8-use-pathlib
    "PYI",    # flake8-pyi
    "Q",      # flake8-quotes
    "RET",    # flake8-return
    "RSE",    # flake8-raise
    "RUF",    # Ruff-specific
    "SIM",    # flake8-simplify
    "SLOT",   # flake8-slots
    "T10",    # flake8-debugger
    "T20",    # flake8-print
    "TC",     # flake8-type-checking
    "TRY",    # tryceratops
    "UP",     # pyupgrade
]
ignore = [
    "PLR09",    # too many <...>: tools/check_size_limits.py covers size
    "PLR2004",  # magic value in comparison: noisy in numerical code
    "TRY003",   # long message at the raise: the rules want messages that say what to fix
    "PERF401",  # list.extend with a comprehension: a guarded append reads better for lists of refusals
    "PERF203",  # try in a loop: no cost on Python 3.11 and later
    "SIM300",   # Yoda conditions: takes the math names T and G for constants, and swapping operands moves the program
]

[tool.ruff.lint.isort]
known-first-party = ["retrieval_framework"]  # the commit guard lints an export without src/, where Ruff cannot detect this
known-third-party = ["vulcan_forward", "vulcan3"]
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pep8-naming]
# Published symbols; docs/method.md holds the glossary.
extend-ignore-names = [
    "N_j", "T", "T_*", "*_T", "*_T_*", "Tirr", "Tint*", "*Tint*", "*T1bar*", "*Tirr*", "P", "M", "R", "S", "W", "G", "N", "Nm", "B", "B_jax",
    "O_*", "A", "C", "C_", "L", "L0", "Y", "Y*", "U", "U5", "Uj", "Z", "Zc", "*lnZ*", "*Kzz*", "lnR0*", "*lnR0*", "lnM*", "*lnM*",
    "*_R", "*_log10P_deck", "*_log10P_rcb", "*_log10P_*", "CD", "AUX", "Theta", "ACC", "LO", "HI", "D", "OBS", "RF", "P_*", "T_inv", "*_rcb", "_REJECT", "_T_MIN", "_T_MAX",
]

[tool.ruff.lint.per-file-ignores]
# Lazy imports stay lazy on purpose: config_schema and run_setup import without jax, and vulcan_chem must precede exojax.
"src/retrieval_framework/*.py" = ["PLC0415"]
# E402, I: vulcan_chem (the import-frozen environment, jax x64) precedes everything exojax here.
"src/retrieval_framework/retrieval_forward.py" = ["PLC0415", "E402", "I"]
# Command-line tools print.
"src/retrieval_framework/validate_env.py" = ["PLC0415", "T20"]
"src/retrieval_framework/run_setup.py" = ["PLC0415", "T20"]
"src/retrieval_framework/run_nautilus.py" = ["PLC0415", "T20"]
"tools/**" = ["T20", "PLC0415"]
# One-off GPU checks: they print, log to the root logger they configure, and name quantities after their symbols. E402, I:
# vulcan_chem and the sibling _artifact precede the rest (PYTHONSAFEPATH strips the script's directory from sys.path).
# D103, D205, D401: a script's module docstring carries the usage.
"validation/**" = ["T20", "PLC0415", "E402", "I", "LOG015", "N806", "D103", "D205", "D401"]
# A test's name is its documentation. Names follow the symbol under test. E402, I: jax x64 and vulcan_chem precede the
# imports that need them. PLW0108: a fresh lambda is a fresh trace. PT011: the exception type is the contract there.
# D205, D401: a test's docstring states its claim in a sentence; a one-line imperative summary would only repeat the name.
"tests/**" = [
    "I", "E402", "T20", "PLC0415", "D103", "D205", "D401", "N802", "N803", "N806", "N812", "PLW0108", "PLW2901", "PTH", "PT011",
]

[tool.codespell]
ignore-words-list = "nd,radis,optin,statics"
skip = "data,runs/*/data"

[tool.coverage.run]
source = ["retrieval_framework"]
omit = []

[tool.coverage.report]
fail_under = 80
exclude_also = [
    '^\s*\.\.\.\s*$',
    'if typing.TYPE_CHECKING:',
    'if TYPE_CHECKING:',
]

[tool.mypy]
files = ["src"]
strict = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
warn_unreachable = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
# ndarray type parameters add nothing here: shapes and dtypes are in the docstrings beside each array.
disallow_any_generics = false
ignore_missing_imports = true
# vulcan3 and exojax carry no types, so what they return is Any; jax's own config.update and vmapped lambdas are untyped.
warn_return_any = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = "retrieval_framework.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
