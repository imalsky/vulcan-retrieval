# code-standards-template
# Based on scientific-python/cookie.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
# Observed spectra and survey inputs are data: no fixer touches them.
exclude: ^data/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "v6.0.0"
    hooks:
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.17.1"
    hooks:
      - id: ruff-check
        args: ["--fix", "--show-fixes"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: "v2.4.0"
    hooks:
      - id: mypy
        files: ^src/
        args: []
        additional_dependencies:
          - numpy
          - jax==0.6.2
          - types-PyYAML

  - repo: https://github.com/jsh9/pydoclint
    rev: "0.12.0"
    hooks:
      # The flake8 form runs only these DOC checks, and it alone can ignore a code. Docstrings hold shapes, such as
      # `T : Tensor [cells]`, which DOC105 and the return-type check would reject as a mismatch with the hint.
      - id: pydoclint-flake8
        args:
          - --select=DOC
          - --extend-ignore=DOC105
          - --style=numpy
          - --check-return-types=False
          - --skip-checking-private-functions=True
          - --check-class-attributes=False
        exclude: ^(tests|experiments)/

  - repo: https://github.com/codespell-project/codespell
    rev: "v2.4.3"
    hooks:
      - id: codespell

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: "v0.11.0.1-1"
    hooks:
      - id: shellcheck

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: "0.26"
    hooks:
      - id: validate-pyproject
        additional_dependencies: ["validate-pyproject-schema-store[all]"]

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: "0.38.2"
    hooks:
      - id: check-github-workflows

  - repo: local
    hooks:
      - id: check-size-limits
        name: size limits
        language: system
        entry: python3 tools/check_size_limits.py
        types: [python]
      - id: no-sys-path-edits
        name: no sys.path edits
        language: pygrep
        entry: 'sys\.path\.(insert|append|extend)|sys\.path\s*='
        types: [python]
        # The GPU checks import their sibling _artifact; PYTHONSAFEPATH strips the script's directory from sys.path.
        exclude: ^validation/
      - id: suppression-has-reason
        name: every noqa or type ignore has a reason on the same line
        language: pygrep
        entry: '#\s*noqa(:\s*[A-Z]+[0-9]+(,\s*[A-Z]+[0-9]+)*)?\s*$|#\s*type:\s*ignore(\[[^\]]*\])?\s*$'
        types: [python]
      - id: conventional-commit
        name: conventional commit subject
        language: pygrep
        entry: '\A(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]+\))?!?: \S'
        args: [--multiline, --negate]
        stages: [commit-msg]
      - id: no-attribution-lines
        name: no attribution lines in the commit message
        language: pygrep
        entry: '(?i)^(co-authored-by|claude-session):'
        stages: [commit-msg]
