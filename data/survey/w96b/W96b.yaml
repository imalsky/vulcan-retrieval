# VULCAN3 configuration (WASP-96b), the sulfur survey's chemistry baseline: the WASP-107b
# case's chemistry settings with this planet's numbers. The recipe:
# notes "Design records", sulfur survey case.
# Paths resolve against the working directory: run from the vulcan-retrieval root.
# System: R* 1.05 R_Sun, Mp 0.48 M_J and Teff 5540 K from Hellier+2014; a/R* 8.989 from arXiv:2604.05049 Table 1, so
# a = 0.04389 AU and Teq = Teff / sqrt(2 a/R*) = 1307 K.
# Gravity is derived as gs = G*Mp/Rp^2.

# ====== Setting up the elements included in the network ======
atom_list:
- H
- O
- C
- N
- S

# ====== Setting up paths and filenames for the input and output files ======
network: thermo/SNCHO_photo_network_2025.txt
# P 10 bar .. 1e-9 bar, a nominal Guillot T (replaced per draw), constant Kzz 1e9 cm^2/s
atm_file: data/survey/w96b/atm_w96b_Kzz.txt
# The solar spectrum (Gueymard) on this star's surface, with no temperature scaling: upstream VULCAN's recipe
# for a Sun-like host (its HD 209458b example; Moses+2011 place the Sun at the orbit).
sflux_file: atm/stellar_flux/Gueymard_solar.txt
vul_ini: output/W96b-nominal.vul
out_name: W96b.vul

# ====== Setting up the elemental abundance ======
use_solar: false
# 10x Lodders 2020 present-day solar, as W39b.yaml
O_H: 0.00537
C_H: 0.00295
N_H: 0.000708
S_H: 0.000141
He_H: 0.0838
const_mix:
  CH4: 0.0059
  O2: 0.0004807
  He: 0.0838
  N2: 0.000354
  H2: 0.9764

# ====== Setting up photochemistry ======
r_star: 1.05
# Rp: the radius at 1 bar, hydrostatic below the 1 mbar transit radius (8.7170e+09 cm,
# Rp/Rs 0.11933) on the nominal profile
Rp: 8.3461e+09
orbit_radius: 0.04389
sl_angle: 1.4486220555555556    # 83 deg, as W39b.yaml
Mp: 9.11102e+29

# ====== Setting up parameters for the atmosphere ======
# 10 bar bottom, as the WASP-107b case (the T window applies on the chemistry grid too)
P_b: 1.0e+07
# 1e-9 bar: the engine puts the chemistry top at the RT top
P_t: 1.0e-03

# ====== Setting up numerical parameters for the ODE solver ======
count_max: 5000    # as the survey base, whose value is the one in force

# ====== Advanced setup (don't change the values if not sure) ======
ini_update_photo_frq: 1    # as the survey base's cfg_overrides
