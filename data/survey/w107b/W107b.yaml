# VULCAN3 configuration (WASP-107b), the sulfur survey's chemistry baseline: the WASP-107b
# case's chemistry settings with this planet's numbers. The recipe:
# notes "Design records", sulfur survey case.
# Paths resolve against the working directory: run from the vulcan-retrieval root.
# System: NASA Exoplanet Archive composite table (2026-10-29): R* 0.657 R_Sun,
# a 0.055 AU, Mp 0.1039 M_J, Teq 736 K, Teff 4425 K.
# Gravity is derived as gs = G*Mp/Rp^2.

# ====== Setting up the elements included in the network ======
atom_list:
- H
- O
- C
- N
- S

# ====== Setting up paths and filenames for the input and output files ======
network: thermo/SNCHO_photo_network_2025.txt
# P 10 bar .. 1e-9 bar, a nominal Guillot T (replaced per draw), constant Kzz 1e9 cm^2/s
atm_file: data/survey/w107b/atm_w107b_Kzz.txt
# MUSCLES v22 HD 85512 scaled to sigma (4425 K)^4, Dyrek+2024's WASP-107 proxy
sflux_file: data/survey/w107b/sflux-HD85512_W107b.txt
vul_ini: output/W107b-nominal.vul
out_name: W107b.vul

# ====== Setting up the elemental abundance ======
use_solar: false
# 10x Lodders 2020 present-day solar, as W39b.yaml
O_H: 0.00537
C_H: 0.00295
N_H: 0.000708
S_H: 0.000141
He_H: 0.0838
const_mix:
  CH4: 0.0059
  O2: 0.0004807
  He: 0.0838
  N2: 0.000354
  H2: 0.9764

# ====== Setting up photochemistry ======
r_star: 0.657
# Rp: the radius at 1 bar, hydrostatic below the 1 mbar transit radius (6.5679e+09 cm,
# Rp/Rs 0.14369) on the nominal profile
Rp: 6.0182e+09
orbit_radius: 0.055
sl_angle: 1.4486220555555556    # 83 deg, as W39b.yaml
Mp: 1.97216e+29

# ====== Setting up parameters for the atmosphere ======
# 10 bar bottom, as the WASP-107b case (the T window applies on the chemistry grid too)
P_b: 1.0e+07
P_t: 0.1

# ====== Setting up numerical parameters for the ODE solver ======
count_max: 30000

# ====== Advanced setup (don't change the values if not sure) ======
ini_update_photo_frq: 5
