# VULCAN3 configuration (WASP-107b), the retrieval's chemistry baseline. Overlays
# vulcan3's default.yaml; network, abundances and numerics as the packaged W39b.yaml.
# Paths resolve against the working directory: run from the vulcan-retrieval root.
# System: Piaulet+2021 (arXiv:2011.13444): Mp 30.5 +- 1.7 M_E, R* 0.67 R_Sun, Teff 4425 K,
# a 0.0566 AU. Gravity is derived as gs = G*Mp/Rp^2.

# ====== Setting up the elements included in the network ======
atom_list:
- H
- O
- C
- N
- S

# ====== Setting up paths and filenames for the input and output files ======
network: thermo/SNCHO_photo_network_2025.txt
# P 10 bar .. 1e-9 bar, a nominal Guillot T (replaced per draw), constant Kzz 1e9 cm^2/s
atm_file: data/w107b/atm_W107b_Kzz.txt
# MUSCLES v22 HD 85512 (the Welbanks+2024 proxy), scaled to sigma Teff^4 of WASP-107
sflux_file: data/w107b/sflux-HD85512_W107b.txt
vul_ini: output/W107b-nominal.vul
out_name: W107b.vul

# ====== Setting up the elemental abundance ======
use_solar: false
# 10x Lodders 2020 present-day solar, as W39b.yaml
O_H: 0.00537
C_H: 0.00295
N_H: 0.000708
S_H: 0.000141
He_H: 0.0838
const_mix:
  CH4: 0.0059
  O2: 0.0004807
  He: 0.0838
  N2: 0.000354
  H2: 0.9764

# ====== Setting up photochemistry ======
r_star: 0.67
# Rp: the radius at 1 bar, hydrostatic below the 1 mbar transit radius (6.675e9 cm,
# Rp/Rs 0.1432) on the nominal profile
Rp: 6.037e+09
orbit_radius: 0.0566
sl_angle: 1.4486220555555556    # 83 deg, as W39b.yaml
Mp: 1.82152e+29                 # 30.5 M_E

# ====== Setting up parameters for the atmosphere ======
# 10 bar bottom: the retrieval's T window (<= 2980 K) applies on the chemistry grid too, and
# a deep Guillot column warms as ~P^0.25, so a 10 bar bottom keeps T(1 bar) up to ~1680 K
# (both papers' profiles). A quench deeper than 10 bar (Kzz >~ 1e12 on cool columns) is
# truncated at the bottom.
P_b: 1.0e+07
P_t: 0.1

# ====== Setting up numerical parameters for the ODE solver ======
count_max: 30000

# ====== Advanced setup (don't change the values if not sure) ======
ini_update_photo_frq: 5
